<extend template="base.shtml">
<head id="head">
</head>
<body id="body">

	<div class="logo-area">
		<div>
			<h2>
				Environmental Systems Microbiology Lab
			</h2>
		</div>

		<div class="below-heading">
			<img src="$site.asset('svgs/logo_green.svg').link()" class="logo">

			<p>Division of Microbial Ecology (<span class="canonical-name">DOME</span>)</p>
			<p>Centre for Microbiology and Environmental Systems Science</p>
			<p>Environment and Climate Research Hub</p>
			<p>University of Vienna</p>

			<div class='logo-icons'>
				<a href='mailto:shaul.pollak.pasternak@univie.ac.at'>
					<svg class='icon'>
						<use href="/icons/icons_opt.svg#email"></use>
					</svg>
				</a>

				<a href='https://scholar.google.com/citations?user=jIHJECUAAAAJ&hl=en'>
					<svg class='icon'>
						<use href="/icons/icons_opt.svg#scholar"></use>
					</svg>
				</a>

				<a href='https://orcid.org/0000-0002-8976-5944'>
					<svg class='icon'>
						<use href="/icons/icons_opt.svg#orcid"></use>
					</svg>
				</a>

				<a href='https://codeberg.org/EnvSysMicroLab'>
					<svg class='icon'>
						<use href="/icons/icons_opt.svg#codeberg"></use>
					</svg>
				</a>

				<a href='https://bsky.app/profile/envsysmicro.at'>
					<svg class='icon'>
						<use href="/icons/icons_opt.svg#bluesky"></use>
					</svg>
				</a>
			</div>
		</div>
	</div>

	<h1>News</h1>
	<div class="news" :loop="$page.contentSections()">
		<div class="news-item" id="$loop.it.id">
			<h2 :html="$loop.it.heading()"></h2>
			<span class="blog-date" :text="$loop.it.id.parseDate().format('January 02, 2006')"></span>
			<ctx :html="$loop.it.htmlNoHeading()"></ctx>
			<hr>
		</div>
	</div>
</body>
